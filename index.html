<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SaRM1FARM</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#120d14;--card:#1b1420;--line:#4a2a14;--text:#fff4ea;--dim:#9c8a8f;--accent:#ff8a1f;--accent2:#c9610a;--common:#a79fb0;--rare:#4aa3ff;--legend:#ffc21a;--green:#2fd16b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(110% 40% at 50% 0,#2b1706 0,var(--bg) 70%) fixed;color:var(--text);font:800 16px/1.3 "Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;padding-bottom:30px;min-height:100vh}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(18,13,20,.92);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.logo{font-size:15px;color:var(--accent);flex:1;letter-spacing:.3px}
.bal{display:flex;align-items:center;background:#1a1220;border:1px solid var(--line);border-radius:14px;padding:4px 4px 4px 10px;gap:8px}
.bal .plus{background:var(--accent2);border:0;color:#fff;font-size:20px;width:34px;height:34px;border-radius:10px;font-weight:800}
.round{width:42px;height:42px;border-radius:50%;border:2px solid var(--accent);background:#1a1220;color:var(--text);font-size:18px;font-weight:800}
main{padding:12px}
h2{font-size:22px;margin:6px 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.case{position:relative;background:linear-gradient(180deg,#24161f,var(--card));border:2px solid var(--line);border-radius:20px;padding:14px 10px 10px;text-align:center;box-shadow:0 0 18px rgba(255,138,31,.12)}
.case .nm{font-size:15px;letter-spacing:.5px}
.case .pic{font-size:64px;margin:10px 0 6px;filter:drop-shadow(0 0 14px rgba(255,138,31,.6))}
.case .ft{display:flex;justify-content:space-between;font-size:13px;color:var(--dim)}
.case .ft b{color:var(--text)}
.tag{position:absolute;top:-10px;right:8px;background:#1d130d;border:2px solid var(--accent);border-radius:10px;padding:2px 8px;font-size:12px;color:var(--accent)}
.box{background:linear-gradient(180deg,#24161f,var(--card));border:2px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px}
.note{font-size:12px;color:var(--dim);font-weight:600;margin:4px 0 10px}
.btn{width:100%;padding:13px;border:0;border-radius:14px;background:linear-gradient(180deg,var(--accent),var(--accent2));color:#fff;font:inherit;font-size:16px;box-shadow:0 0 16px rgba(255,138,31,.35)}
.btn:disabled{opacity:.35;box-shadow:none}
.btn.sm{width:auto;padding:8px 12px;font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.item{padding:10px 12px;border-radius:14px;border:2px solid var(--line);margin:8px 0;background:#150f19}
.sel{border-color:var(--accent);box-shadow:0 0 14px rgba(255,138,31,.5)}
.common{color:var(--common)}.rare{color:var(--rare)}.legend{color:var(--legend)}
.result{text-align:center;font-size:20px;padding:18px}
#menu{position:fixed;inset:0;z-index:10;background:rgba(10,6,12,.96);padding:16px 12px;overflow:auto;display:none}
#menu.on{display:block}
.mi{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px 16px;margin-bottom:10px;color:var(--text);font:inherit;font-size:20px;text-align:left}
.mi i{font-style:normal;color:var(--accent);font-size:22px;width:26px;text-align:center}
.mi.gold{color:var(--accent)}

.back{background:#1a1220;border:2px solid var(--line);color:var(--text);font:inherit;font-size:15px;border-radius:14px;padding:10px 16px}
.ctitle{text-align:center;font-size:26px;margin:18px 0 6px}
.cpic{text-align:center;font-size:120px;margin:6px 0 14px;filter:drop-shadow(0 0 28px rgba(255,138,31,.55))}
.strip{position:relative;overflow:hidden;border:2px solid var(--line);border-radius:20px;background:#170f1d;padding:12px 0;margin-bottom:14px}
.strip:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:var(--accent);box-shadow:0 0 12px var(--accent);transform:translateX(-50%)}
.track{display:flex;gap:8px;will-change:transform}
.sc{flex:0 0 110px;height:110px;border-radius:14px;border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:6px 4px;font-size:12px;text-align:center}
.seg{display:flex;background:#150f19;border:2px solid var(--line);border-radius:18px;padding:6px;margin-bottom:12px}
.seg button{flex:1;padding:12px 4px;border:0;border-radius:12px;background:none;color:var(--dim);font:inherit;font-size:16px}
.seg button.on{background:linear-gradient(180deg,var(--accent),var(--accent2));color:#fff}
.open{width:100%;padding:18px;border-radius:18px;border:2px solid var(--line);background:#1a1220;color:var(--dim);font:inherit;font-size:18px;margin-bottom:6px}
.open.ok{background:linear-gradient(180deg,var(--accent),var(--accent2));color:#fff;border-color:var(--accent);box-shadow:0 0 20px rgba(255,138,31,.4)}
.sub{text-align:center;color:var(--dim);font-size:14px;letter-spacing:2px;margin:22px 0 12px}
.prizes{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.pz{width:calc(50% - 6px);aspect-ratio:1/1;border-radius:18px;border:2px solid;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:10px;text-align:center}
.pz .pn{font-size:15px}.pz .pv{font-size:14px;color:var(--dim);margin-top:4px}
.g-common{background:radial-gradient(circle at 50% 20%,rgba(120,140,190,.45),#171221 75%);border-color:#38405f}
.g-rare{background:radial-gradient(circle at 50% 20%,rgba(130,70,220,.6),#171221 75%);border-color:#5a3a9a}
.g-legend{background:radial-gradient(circle at 50% 20%,rgba(220,60,90,.65),#171221 75%);border-color:#9a3a55}
.rl{display:flex;justify-content:space-between;font-size:14px;margin:4px 0}

.wheelw{display:flex;justify-content:center;margin:6px 0 14px}
.wheel{width:min(78vw,320px);height:auto;overflow:visible;filter:drop-shadow(0 0 22px rgba(217,68,82,.35))}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips button{flex:0 0 auto;min-width:56px;padding:12px 10px;border-radius:14px;border:2px solid var(--line);background:#150f19;color:var(--dim);font:inherit;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.slot{min-height:132px;border:2px solid var(--line);border-radius:20px;background:#150f19;padding:12px 8px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;font-size:13px;color:var(--dim)}
.slot b{font-size:14px;color:var(--text)}.slot .big{font-size:26px;color:var(--dim)}
.slot.on{border-color:var(--accent)}
.coinbox{border:2px solid var(--line);border-radius:20px;background:#150f19;padding:12px 14px;margin-bottom:12px}
.coinbox input{width:100%;accent-color:var(--accent);margin-top:10px}
.pill{display:block;margin:0 auto 14px;width:max-content;min-width:210px;text-align:center;padding:14px 28px;border-radius:22px;border:2px solid;font-size:24px;letter-spacing:1px;background:#16090d}
.pill.lose{color:#ff4d5e;border-color:#ff4d5e;box-shadow:0 0 22px rgba(255,77,94,.55),inset 0 0 14px rgba(255,77,94,.25);text-shadow:0 0 12px rgba(255,77,94,.8)}
.pill.win{color:#2fe27a;border-color:#2fe27a;background:#07150d;box-shadow:0 0 22px rgba(47,226,122,.55),inset 0 0 14px rgba(47,226,122,.25);text-shadow:0 0 12px rgba(47,226,122,.8)}
@keyframes shk{0%,100%{transform:rotate(0)}20%{transform:rotate(-5deg) scale(1.05)}40%{transform:rotate(5deg) scale(1.05)}60%{transform:rotate(-4deg)}80%{transform:rotate(4deg)}}
.shake{animation:shk .5s infinite}
.igrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ic{border:2px solid;border-radius:16px;overflow:hidden;text-align:center;padding-bottom:8px;background:#150f19}
.ic .im{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:42px}
.ic .im img{max-width:100%;max-height:100%;object-fit:contain}
.ic .in{font-size:12px;padding:0 4px;min-height:30px;display:flex;align-items:center;justify-content:center}
.ic .ip{font-size:12px;color:var(--dim)}
.ic .btn{padding:7px 4px;font-size:12px;width:calc(100% - 12px);margin:6px 6px 0}
.ic.sel{box-shadow:0 0 16px rgba(255,138,31,.7);border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.st{background:#150f19;border-radius:16px;padding:14px 4px;text-align:center}
.st i{font-style:normal;color:var(--accent);font-size:20px}.st b{display:block;font-size:24px;margin:4px 0 2px}.st span{font-size:11px;color:var(--dim)}
.epic{color:#b455ff}.mythic{color:#ff4b4b;text-shadow:0 0 10px rgba(255,75,75,.7)}
.g-epic{background:radial-gradient(circle at 50% 20%,rgba(150,70,255,.7),#171221 75%);border-color:#6a3ab8}
.g-mythic{background:radial-gradient(circle at 50% 20%,rgba(255,60,60,.8),#1a0c10 75%);border-color:#c0334a}
.rgrid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:10px}
.rgrid .ic{width:calc(33.33% - 7px)}.rgrid.one .ic{width:56%}.rgrid.one .im{font-size:70px}
.pic img{display:block;margin:0 auto;width:100%;height:96px;object-fit:contain}
.cpic img{max-width:84%;max-height:260px;object-fit:contain}
.yellow{color:#ffd23a}.red{color:#ff5a5a}.pink{color:#ff7ac8}.black{color:#d4d4d4}
.g-yellow{background:radial-gradient(circle at 50% 20%,rgba(255,200,40,.7),#1b1608 78%);border-color:#a8841a}
.g-red{background:radial-gradient(circle at 50% 20%,rgba(235,60,60,.75),#1e0b0d 78%);border-color:#a82e35}
.g-pink{background:radial-gradient(circle at 50% 20%,rgba(255,105,190,.75),#1f0c1a 78%);border-color:#b8447f}
.g-black{background:radial-gradient(circle at 50% 20%,#3a3a3a,#050505 80%);border-color:#6b6b6b}
.sec{font-size:15px;color:var(--accent);letter-spacing:1.5px;margin:20px 0 10px}
.cm{font-size:58px;text-align:center;margin:6px 0;color:var(--text);font-variant-numeric:tabular-nums}
.cm.run{color:var(--accent)}.cm.win{color:#2fe27a;text-shadow:0 0 18px rgba(47,226,122,.6)}.cm.lose{color:#ff4d5e;text-shadow:0 0 18px rgba(255,77,94,.6)}
@keyframes pop{0%{transform:scale(2.2);opacity:0}60%{transform:scale(.95);opacity:1}100%{transform:scale(1)}}
.cm.cnt{color:#fff;font-size:72px;animation:pop .55s ease-out;text-shadow:0 0 22px var(--accent)}
.crashbox{text-align:center}
.ch{flex:0 0 auto;padding:6px 10px;border-radius:12px;border:2px solid var(--line);font-size:13px;background:#150f19}
.ch.lo{color:#ff6a75}.ch.mid{color:var(--accent)}.ch.hi{color:#2fe27a}
.inp{width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:#150f19;color:var(--text);font:inherit;font-size:18px}
.qb{display:flex;gap:8px;margin:8px 0 12px}.qb button{flex:1;padding:10px 4px;border-radius:12px;border:2px solid var(--line);background:#150f19;color:var(--text);font:inherit;font-size:14px}
.sky{width:100%;height:auto;display:block;border-radius:14px;border:2px solid var(--line);margin-bottom:8px;background:
radial-gradient(1.5px 1.5px at 12% 22%,#fff,transparent),radial-gradient(1.5px 1.5px at 38% 12%,#fff,transparent),radial-gradient(1px 1px at 61% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 83% 16%,#fff,transparent),radial-gradient(1px 1px at 72% 62%,#fff,transparent),radial-gradient(1px 1px at 25% 70%,#fff,transparent),
linear-gradient(#0a0618,#1d1033)}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:8}
.sheet{position:fixed;left:0;right:0;bottom:0;height:50vh;z-index:9;background:var(--card);border-top:2px solid var(--accent);border-radius:22px 22px 0 0;padding:14px 12px 24px;overflow-y:auto;box-shadow:0 -10px 30px rgba(0,0,0,.6);animation:slideup .25s ease-out}
.sheet .pz{width:calc(33.33% - 8px);font-size:12px}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.mc{aspect-ratio:1/1;border:2px solid var(--line);border-radius:14px;background:#150f19;color:var(--dim);font:inherit;font-size:24px;display:flex;align-items:center;justify-content:center;padding:4px}
.mc img{width:100%;height:100%;object-fit:contain}
.mc.ok{border-color:#2fe27a;background:radial-gradient(circle,rgba(47,226,122,.3),#0d1a12)}
.mc.bomb{border-color:#ff4d5e;background:#2a0f14}.mc.dim{opacity:.5}
.mrow{display:flex;justify-content:space-between;gap:8px}.mrow .st{flex:1}
</style>
</head>

let mn={sel:[],locked:[],betv:0,prize:null,mines:7,running:false,done:false,win:false,grid:[],open:[],hit:-1,msg:""};
/* лесенка иксов для 10 мин задана вручную, для другого числа мин она масштабируется: чем больше мин, тем больше икс */
const MN_L10=[1.10,1.3,1.6,1.8,2.1,2.7,3.5,4.9,6.5,8.5,11,14,18,23,30];
const mnFair=(k,m)=>{let f=1;for(let i=0;i<k;i++)f*=(MN_N-i)/(MN_N-m-i);return f};
const mnProb=(k,m)=>{let p=1;for(let i=0;i<k;i++)p*=(MN_N-m-i)/(MN_N-i);return p};
const MN_A=MN_L10.map((x,i)=>Math.log(x)/Math.log(mnFair(i+1,10)));
const mnMult=(k,m)=>{if(k<=0)return 1;if(k>MN_N-m)return 0;return Math.max(1,Math.round(Math.pow(mnFair(k,m),MN_A[Math.min(k,MN_L10.length)-1])*100)/100)};
const mnPrev=m=>[1,2,3].filter(k=>k<=MN_N-m).map(k=>"x"+mnMult(k,m).toFixed(2)+" ("+(mnProb(k,m)*100).toFixed(mnProb(k,m)<0.1?1:0)+"%)").join(" · ");
function toggleMn(i){if(mn.running)return;const it=S.inv[i];if(!it)return;
 const k=mn.sel.indexOf(it);if(k>=0)mn.sel.splice(k,1);else if(mn.sel.filter(x=>S.inv.includes(x)).length<MN_MAX)mn.sel.push(it);render()}
function mnStart(){if(mn.running)return;const its=mn.sel.filter(x=>S.inv.includes(x));
 if(!its.length){mn.msg="Выбери предметы для ставки";return render()}
 /* ставка списывается сразу: предметы уходят из инвентаря */
 mn.locked=its;S.inv=S.inv.filter(it=>!its.includes(it));mn.sel=[];mn.betv=its.reduce((t,it)=>t+val(it),0);save();
 const g=Array(MN_N).fill(false);let c=0;while(c<mn.mines){const i=Math.floor(Math.random()*MN_N);if(!g[i]){g[i]=true;c++}}
 mn.grid=g;mn.open=[];mn.hit=-1;mn.running=true;mn.done=false;mn.win=false;mn.msg="";mn.prize=null;render()}
function mnEnd(win,msg){mn.running=false;mn.done=true;mn.win=win;mn.msg=msg;mn.locked=[];save();render()}
function mnCash(){if(!mn.running||!mn.open.length)return;const m=mnMult(mn.open.length,mn.mines),P=Math.floor(mn.betv*m),pr=crashPrize(P);
 pr.got.forEach(it=>S.inv.push(it));S.coins+=pr.coins;mn.prize=pr;
 mnEnd(true,`Забрал на x${m.toFixed(2)}: ${P} ⛁ (ставка ${mn.betv} ⛁)`)}
function mnOpen(i){if(!mn.running||mn.open.includes(i))return;
 if(mn.grid[i]){mn.hit=i;return mnEnd(false,`Мина! Предметы сгорели (${mn.betv} ⛁)`)}

  const k=mn.open.length,m=mn.mines,cur=k?mnMult(k,m):1,nxt=mnMult(k+1,m),pay=Math.floor(mn.betv*cur),sel=mn.sel.filter(x=>S.inv.includes(x)),sv=mn.running?mn.betv:sel.reduce((t,x)=>t+val(x),0);
  const cells=Array.from({length:MN_N},(_,i)=>{
   if(mn.open.includes(i))return`<button class="mc ok" disabled><img src="${MN_IMG}" alt=""></button>`;
   if(mn.done&&mn.grid[i])return`<button class="mc bomb ${i===mn.hit?"":"dim"}" disabled>${i===mn.hit?"💥":"💣"}</button>`;
   return`<button class="mc ${mn.done?"dim":""}" ${mn.running?"":"disabled"} onclick="mnOpen(${i})"></button>`}).join("");
  h=`<h2>Мины</h2>
  <div class="mrow"><div class="st box" style="margin:0;text-align:center"><div class="note" style="margin:0">Сейчас</div><b style="font-size:22px">x${cur.toFixed(2)}</b></div><div class="st box" style="margin:0;text-align:center"><div class="note" style="margin:0">Следующая клетка</div><b style="font-size:22px">${mn.running&&k<MN_N-m?"x"+nxt.toFixed(2):"-"}</b>${mn.running&&k<MN_N-m?`<div class="note" style="margin:2px 0 0">шанс дойти ${(mnProb(k+1,m)*100).toFixed(mnProb(k+1,m)<0.1?1:0)}% · возврат ${Math.round(mnProb(k+1,m)*nxt*100)}%</div>`:""}</div></div>
  <div class="mgrid">${cells}</div>
  <div class="note" style="text-align:center">${mn.msg||""}</div>`;
  if(mn.running){h+=`<button class="open ${k?"ok":""}" onclick="mnCash()" ${k?"":"disabled"}>${k?"Забрать "+pay+" ⛁":"Открой хотя бы одну клетку"}</button>`}
  else{h+=`<div class="box"><div class="row"><div class="note" style="margin:0">КОЛИЧЕСТВО МИН</div><b id="mnv" style="font-size:22px">${mn.mines}</b></div>
  <input type="range" min="${MN_MIN}" max="24" value="${mn.mines}" style="width:100%;height:34px;accent-color:var(--accent);margin-top:6px" oninput="mn.mines=+this.value;document.getElementById('mnv').textContent=this.value;document.getElementById('mnp').textContent=Math.round((MN_N-this.value)/MN_N*100)+'%';document.getElementById('mnx').textContent=mnPrev(+this.value)" onchange="render()">
  <div class="row note" style="margin:2px 0 0"><span>${MN_MIN}</span><span>24</span></div>
  <div class="note" style="margin-top:8px">Множитель (шанс дойти) за 1, 2 и 3 безопасные клетки: <b id="mnx">${mnPrev(mn.mines)}</b></div><div class="note" style="margin-top:4px">Шанс, что первая клетка безопасна: <span id="mnp">${Math.round((MN_N-mn.mines)/MN_N*100)}%</span></div></div>
  <div class="note">СТАВКА: ${sel.length} предм. · ${sv} ⛁</div>
  <button class="open ${sel.length?"ok":""}" onclick="mnStart()">Играть</button>`}
  if(mn.done&&mn.win&&mn.prize){const pr=mn.prize;
   h+=`<div class="box" style="margin-top:12px"><div class="note">ПРИЗ · уже в инвентаре</div><div class="rgrid ${pr.got.length===1?"one":""}">${pr.got.map(it=>`<div class="ic g-${it.r}"><div class="im">${icon(it)}</div><div class="in ${it.r}">${it.n}</div><div class="ip">${PRICE[it.n]} ⛁</div></div>`).join("")}</div>${pr.coins?`<div class="note" style="text-align:center">+ ${pr.coins} ⛁ монетами (остаток)</div>`:""}</div>`}
  if(!mn.running){h+=`<div class="note" style="margin-top:14px">ИНВЕНТАРЬ</div>`+(S.inv.length?'<div class="igrid">'+S.inv.map((it,i)=>({it,i})).sort((a,b)=>val(b.it)-val(a.it)).map(({it,i})=>`<div class="ic g-${it.r} ${sel.includes(it)?"sel":""}" onclick="toggleMn(${i})"><div class="im">${icon(it)}</div><div class="in ${it.r}">${it.n}</div><div class="ip">${val(it)} ⛁</div></div>`).join("")+'</div>':'<div class="box">Инвентарь пуст. Открой кейсы, чтобы получить предметы.</div>')}}
 if(tab==="profile"){const st=S.st,lvl=1+Math.floor(st.xp/20),u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
  h=`<h2>${u?u.first_name:"Профиль"}</h2><div class="box"><div class="note">СТАТИСТИКА</div><div class="stats">${[["🎁",st.cases,"КЕЙСЫ"],["↑",st.ups,"АПГРЕЙДЫ"],["🏆",st.wins,"ПОБЕДЫ"],["★",lvl,"УРОВЕНЬ"],["▣",S.inv.length,"ПРЕДМЕТЫ"],["⛁",S.coins,"МОНЕТЫ"]].map(x=>`<div class="st"><i>${x[0]}</i><b>${x[1]}</b><span>${x[2]}</span></div>`).join("")}</div></div>
  <div class="box"><div class="note">ИСТОРИЯ ДРОПА (последние 20)</div>${S.hist.length?S.hist.slice().reverse().map(it=>`<div class="rl"><span class="${it.r}">${it.n}</span><span>${NAME[it.r]}</span></div>`).join(""):"Пока пусто"}</div>`+invHtml()}
 if(tab==="up"){const ch=chanceNow(),C=2*Math.PI*70,sv=stakeV(),can=!spinning&&up.target&&sv&&sv<up.target.v;
  h=`<h2>Апгрейд</h2>
  <div class="seg"><button class="${!up.fast?"on":""}" onclick="setUpFast(false)">✦ Обычно</button><button class="${up.fast?"on":""}" onclick="setUpFast(true)">⚡ Быстро</button></div>
  <div class="wheelw"><svg class="wheel" viewBox="0 0 200 200">
  <defs><linearGradient id="fr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset=".5" stop-color="#e2461c"/><stop offset="1" stop-color="#7a1c0c"/></linearGradient></defs>
  <circle cx="100" cy="100" r="98" fill="#15101b"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#fr)" stroke-width="9" style="filter:drop-shadow(0 0 6px #ff6a1f)"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="#3a1208" stroke-width="2"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#e24d58" stroke-width="22"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#2fc46a" stroke-width="22" stroke-dasharray="${ch/100*C} ${C}" transform="rotate(-90 100 100)"/>
  <circle cx="100" cy="100" r="58" fill="#070405" stroke="#3a1208" stroke-width="3"/>
  <g fill="#ffb347" stroke="#7a1c0c" stroke-width="1.5"><polygon points="100,6 106,14 100,22 94,14"/><polygon points="100,178 106,186 100,194 94,186"/><polygon points="6,100 14,94 22,100 14,106"/><polygon points="178,100 186,94 194,100 186,106"/></g>
  <g id="arrow" style="transform-origin:100px 100px;transform:rotate(${up.ang}deg)"><polygon points="91,-10 109,-10 100,6" fill="#fff" style="filter:drop-shadow(0 0 5px #fff)"/></g>
  <text x="100" y="100" text-anchor="middle" font-size="28" fill="#fff" font-weight="800" font-family="inherit">${ch}%</text>
  <rect x="88" y="106" width="24" height="2" fill="#9c8a8f"/>
  <text x="100" y="122" text-anchor="middle" font-size="8" fill="#9c8a8f" font-weight="800" letter-spacing="2" font-family="inherit">ШАНС</text></svg></div>${up.win===null||spinning?"":`<div class="pill ${up.win?"win":"lose"}">${up.win?"ПОБЕДА":"ПОРАЖЕНИЕ"}</div>`}
  <div class="two"><div class="slot ${sv?"on":""}"><b>ТВОЙ ВКЛАД</b>${sv?`<div class="big" style="color:var(--text)">${sv} ⛁</div><span>${(spinning?up.locked:up.items).length} предм.</span>`:'<div class="big">⌄</div><span>ВЫБЕРИ ПРЕДМЕТ ВНИЗУ</span>'}</div>
  <div class="slot ${up.target?"on":""}" onclick="showTargets(true)"><b>ЖЕЛАЕМЫЙ ПРЕДМЕТ</b>${up.target?`<div class="big ${up.target.r}" style="font-size:18px">${up.target.n}</div><span>${up.target.v} ⛁ · x${(up.target.v/(sv||1)).toFixed(1)}</span>`:'<div class="big">+</div><span>ВЫБРАТЬ ЦЕЛЬ</span>'}</div></div>`;
  h+=up.warn?`<div class="note" style="color:#ff6a75;margin-bottom:8px">${up.warn}</div>`:"";
  h+=`<button class="open ${can?"ok":""}" onclick="upgrade()">Прокачать</button>`+(up.res?`<div class="box result" style="margin-top:12px">${up.res}</div>`:"");
  if(up.pick){const L=[...CAT].filter(c=>c.v>sv).sort((a,b)=>up.asc?a.v-b.v:b.v-a.v);
   h+=`<div class="sheetbg" onclick="showTargets(false)"></div><div class="sheet"><div class="row" style="margin-bottom:8px"><b>Выбери цель</b><div class="row" style="gap:8px">${ordBtn()}<button class="round" style="width:38px;height:38px;font-size:16px" onclick="showTargets(false)">✕</button></div></div><div class="note">${L.length?(sv?"Показаны только предметы дороже твоего вклада ("+sv+" ⛁).":"Добавь вклад, и останутся только цели дороже него."):"Нет предметов дороже твоего вклада."}</div><div class="prizes">${L.map(c=>`<div class="pz g-${c.r}" onclick="setTarget('${c.n}')"><div style="font-size:34px;margin-bottom:auto">${icon(c)}</div><div class="pn">${c.n}</div><div class="pv">${c.v} ⛁</div></div>`).join("")}</div></div>`}
  h+=`<div class="row" style="margin-bottom:8px"><div class="note" style="margin:0">ИНВЕНТАРЬ</div>${ordBtn()}</div>`;
  h+=S.inv.length?'<div class="igrid">'+S.inv.map((it,i)=>({it,i})).sort((a,b)=>up.asc?val(a.it)-val(b.it):val(b.it)-val(a.it)).map(({it,i})=>`<div class="ic g-${it.r} ${up.items.includes(i)?"sel":""}" onclick="toggleStake(${i})"><div class="im">${icon(it)}</div><div class="in ${it.r}">${it.n}</div><div class="ip">${val(it)} ⛁</div></div>`).join("")+'</div>':'<div class="note">Инвентарь пуст</div>';
}
 if(tab==="case"){const c=CASES[cur],cost=c.free?0:c.p*mult,ok=c.free?freeLeft(c)===0:S.coins>=cost;
  h=`<button class="back" onclick="go('cases')">‹ Назад</button><div class="ctitle">${c.n}</div>`;
  if(resOpen){h+=resPanel();view.innerHTML=h;return}
  h+=`<div class="cpic ${spinning?"shake":""}">${c.img?`<img src="${c.img}" alt="">`:c.ic}</div>`;
  if(strip)h+=strip.map((arr,n)=>`<div class="strip"><div class="track" id="trk${n}">${arr.map(it=>`<div class="sc g-${it.r} ${it.r}">${it.n}</div>`).join("")}</div></div>`).join("");
  else{const prev=[];for(let k=0;k<12;k++){const x=c.tab[k%c.tab.length];prev.push({r:x.r,n:x.n})}
   h+=`<div class="strip"><div class="track" style="transform:translateX(-30px)">${prev.map(it=>`<div class="sc g-${it.r} ${it.r}">${it.n}</div>`).join("")}</div></div>`}
  h+=(c.free?"":`<div class="seg">${[1,3,5].map(m=>`<button class="${mult===m?"on":""}" onclick="setMult(${m})">x${m}</button>`).join("")}</div>`)+`
  <div class="seg"><button class="${!fast?"on":""}" onclick="setFast(false)">⌛ Медленно</button><button class="${fast?"on":""}" onclick="setFast(true)">⏩ Пропустить</button></div>
  <button class="open ${ok&&!spinning?"ok":""}" onclick="spin()">${c.free?(ok?"ОТКРЫТЬ БЕСПЛАТНО (осталось "+freeCount(c)+")":"ДОСТУПНО ЧЕРЕЗ "+fmt(freeLeft(c))):(ok?"ОТКРЫТЬ · "+cost+" ⛁":"НЕ ХВАТАЕТ "+(cost-S.coins)+" ⛁")}</button>`;
  if(msg)h+=`<div class="box result" style="margin-top:12px">${msg}</div>`;

  h+=`<div class="sub">ВОЗМОЖНЫЕ ПРИЗЫ</div><div class="prizes">${[...c.tab].sort((a,b)=>b.v-a.v).map(x=>`<div class="pz g-${x.r}"><div style="font-size:46px;margin-bottom:auto">${icon(x)}</div><div class="pn ${x.r}">${x.n}${x.cnt>1?" ×"+x.cnt:""}</div><div class="pv">${pcf(x.pc)}%</div></div>`).join("")}</div>`;
}
 view.innerHTML=h}
render();
try{if(tg&&tg.CloudStorage)tg.CloudStorage.getItem(KEY,(e,v)=>{if(e||!v)return;const c=unpack(v);if(c&&c.t>(S.t||0)&&!spinning){S=Object.assign(S,c);S.st=S.st||{cases:0,ups:0,wins:0,xp:0};try{localStorage.setItem(KEY,JSON.stringify(S))}catch(x){}render()}})}catch(e){}
setInterval(()=>{if(!spinning&&(tab==="cases"||tab==="case")&&CASES.some(c=>c.free&&freeLeft(c)>0))render()},30000);
</script>
</body>
</html>
